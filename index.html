<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberinto Divertido - Lectores C-C-C</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(#1e0f3d, #0a1328);
            color: #fff;
            text-align: center;
        }
        h1 { color: #bb9eff; text-shadow: 0 0 10px #bb9eff; }
        .hud { font-size: 1.8em; margin: 10px 0; }
        canvas {
            border: 7px solid #8b7dff;
            border-radius: 20px;
            box-shadow: 0 0 30px #8b7dff;
        }
        button {
            padding: 14px 24px;
            margin: 10px;
            font-size: 1.2em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .correct { background: #22cc88; }
        .wrong { background: #ff5555; }
    </style>
</head>
<body>
    <h1>🏛️ Laberinto Mágico de Lectores</h1>
    <div class="hud">
        ❤️ <span id="lives">3</span> &nbsp;&nbsp; 
        ⭐ <span id="score">0</span> &nbsp;&nbsp; 
        ⏱️ <span id="timer">60</span> &nbsp;&nbsp; 
        Nivel <span id="level">1</span>
    </div>

    <canvas id="game" width="760" height="600"></canvas>

    <div id="question" style="margin:20px; font-size:1.45em; min-height:100px;"></div>
    <div id="feedback"></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const TILE = 40;

        let lives = 3;
        let score = 0;
        let timeLeft = 60;
        let level = 1;
        let player = { x: 1, y: 1 };
        let timerInterval;

        const maze = [ /* mismo laberinto anterior */ ];

        const goal = { x: 17, y: 9 };

        const questions = [
            {
                q: "¿Cómo interactúa este texto con otros?",
                a: ["Mediante referencias e inferencias", true],
                b: ["Solo con sinónimos", false]
            }
            // Podemos agregar más preguntas aquí
        ];

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 60;
            document.getElementById('timer').textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("¡Se acabó el tiempo!");
                }
            }, 1000);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Laberinto con colores más bonitos
            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = '#5a4a8a';
                        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
                    } else {
                        ctx.fillStyle = '#1e2a4f';
                        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
                    }
                }
            }

            // Meta brillante
            ctx.fillStyle = '#ffdd55';
            ctx.fillRect(goal.x*TILE + 4, goal.y*TILE + 4, TILE-8, TILE-8);

            // Personaje más divertido
            const px = player.x * TILE + TILE/2;
            const py = player.y * TILE + TILE/2;
            
            ctx.fillStyle = '#ffcc33';
            ctx.beginPath();
            ctx.arc(px, py, TILE/2 - 4, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#ff66aa';
            ctx.beginPath();
            ctx.arc(px, py - 12, 15, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(px-8, py-6, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px+8, py-6, 4, 0, Math.PI*2); ctx.fill();
        }

        // ... (continúa con los controles y answer function)

        document.addEventListener('keydown', /* mismo código anterior */);

        window.answer = function(correct) {
            const feedback = document.getElementById('feedback');
            if (correct) {
                score += 100;
                document.getElementById('score').textContent = score;
                feedback.innerHTML = `<p style="color:#22ff88; font-size:1.6em">¡Excelente! 🎉 +100 puntos</p>`;
                setTimeout(() => {
                    level++;
                    document.getElementById('level').textContent = level;
                    player = {x:1, y:1};
                    draw();
                }, 1200);
            } else {
                lives--;
                document.getElementById('lives').textContent = lives;
                feedback.innerHTML = `<p style="color:#ff6666">Incorrecto 😔</p>`;
            }
        };

        // Iniciar
        draw();
        startTimer();
    </script>
</body>
</html>
